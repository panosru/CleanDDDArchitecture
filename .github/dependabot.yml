version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      microsoft:
        patterns: ['Microsoft.*', 'System.*']
      aspire:
        patterns: ['Aspire.*']
      opentelemetry:
        patterns: ['OpenTelemetry*']
      testing:
        patterns: ['xunit*', 'AwesomeAssertions', 'coverlet*', 'Microsoft.NET.Test.Sdk', 'Testcontainers*', 'NetArchTest*']
    ignore:
      # 13+ requires a commercial licence (ADR 006).
      - dependency-name: MediatR
        versions: ['>= 13.0.0']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
