version: '3.9'

services:
  kurrentdb:
    image: kurrentplatform/kurrentdb:26.1.2
    container_name: ${KURRENTDB_HOST}
    restart: 'no'
    logging:
      driver: "json-file"
      options:
        max-size: 2m
        max-file: '3'
    expose:
      - 2113
    environment:
      KURRENTDB_CLUSTER_SIZE: 1
      KURRENTDB_RUN_PROJECTIONS: None
      KURRENTDB_INSECURE: "true"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://127.0.0.1:2113/health/live || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
